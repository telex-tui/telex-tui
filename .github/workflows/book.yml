name: Deploy Book

# NOTE: This workflow is ready for launch but currently disabled.
# GitHub Pages only works for public repos. Once the repo is public,
# uncomment the 'on:' triggers below to enable automatic deployment.

on:
  # Disabled until repository is made public
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'docs/book/**'
  #     - '.github/workflows/book.yml'
  workflow_dispatch:  # Manual trigger available for testing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          mkdir -p ~/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C ~/bin
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Build book
        run: |
          cd docs/book
          mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
