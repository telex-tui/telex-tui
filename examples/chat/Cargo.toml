[package]
name = "chat"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI chat example built with Telex TUI framework"

[[bin]]
name = "chat"
path = "src/main.rs"

[dependencies]
telex-tui = { path = "../../crates/telex" }
ureq = { version = "2.9", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
