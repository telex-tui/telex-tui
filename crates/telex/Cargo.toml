[package]
name = "telex-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A DX-first TUI framework for building AI terminal applications"
repository = "https://github.com/telex-tui/telex-tui"
homepage = "https://github.com/telex-tui/telex-tui"
readme = "../../README.md"
documentation = "https://telex-tui.github.io/telex-tui/"
keywords = ["tui", "terminal", "ui", "cli", "reactive"]
categories = ["command-line-interface", "gui"]

[lib]
name = "telex"

[dependencies]
telex-macro = { version = "0.2.0", path = "../telex-macro" }
base64 = "0.22"
crossterm = "0.28"
pulldown-cmark = "0.10"
regex = "1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
portable-pty = "0.9"
vte = "0.15"
